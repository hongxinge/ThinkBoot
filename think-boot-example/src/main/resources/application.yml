server:
  port: 8080

spring:
  # ==========================================
  # 单数据源配置（默认启用，直接使用即可）
  # ==========================================
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/thinkboot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ThinkBootHikariPool

  # ==========================================
  # 多数据源配置（使用时请注释上面的单数据源配置，然后取消注释下面的配置）
  # ==========================================
  # datasource:
  #   dynamic:
  #     primary: master          # 默认数据源
  #     strict: false            # 严格模式：true-未匹配到数据源抛异常，false-未匹配使用默认数据源
  #     datasource:
  #       master:                # 主库（写操作）
  #         url: jdbc:mysql://localhost:3306/thinkboot_master?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
  #         username: root
  #         password: root
  #         driver-class-name: com.mysql.cj.jdbc.Driver
  #       slave:                 # 从库（读操作）
  #         url: jdbc:mysql://localhost:3306/thinkboot_slave?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
  #         username: root
  #         password: root
  #         driver-class-name: com.mysql.cj.jdbc.Driver
  #       oracle:                # Oracle 数据源示例
  #         url: jdbc:oracle:thin:@localhost:1521:orcl
  #         username: system
  #         password: oracle
  #         driver-class-name: oracle.jdbc.OracleDriver
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==========================================
# Sa-Token 配置（文档：https://sa-token.cc）
# ==========================================
sa-token:
    # token 名称（同时也是 cookie 名称，建议前端在 Header 中传递此字段）
    token-name: Authorization
    # token 有效期（单位：秒）默认30天，-1 代表永久有效
    timeout: 2592000
    # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
    active-timeout: -1
    # 是否允许同一账号多地同时登录 （为 true 时允许一起登录，为 false 时新登录挤掉旧登录）
    is-concurrent: true
    # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token，为 false 时每次登录新建一个 token）
    is-share: false
    # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
    token-style: uuid
    # 是否输出操作日志
    is-log: false

think-boot:
  auth:
    enabled: true
    exclude-paths:
      - /api/auth/login
      - /api/auth/register
      - /api/public/**
  database:
    enabled: true
  redis:
    enabled: false
  storage:
    enabled: false
  swagger:
    enabled: true

logging:
  level:
    com.thinkboot: debug